<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShipRate — Quote Trace Debug</title>
<style>
  body { font-family: monospace; max-width: 900px; margin: 20px auto; padding: 0 15px; background: #1a1a1a; color: #e0e0e0; }
  h1 { font-size: 1.2em; }
  .trace { background: #2a2a2a; border: 1px solid #444; border-radius: 6px; padding: 12px; margin: 12px 0; }
  .trace-id { color: #7fd4ff; }
  .stage { padding: 2px 0; }
  .stage-ok { color: #7fff9f; }
  .stage-stuck { color: #ff7f7f; font-weight: bold; }
  .meta { color: #999; font-size: 0.85em; }
  button { background: #e8722a; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-size: 1em; cursor: pointer; margin: 5px; }
  #status { margin: 10px 0; color: #ffcc00; }
</style>
</head>
<body>
<h1>Quote Request Traces</h1>
<p class="meta">Shows where recent quote requests stopped. Run a quote first, then refresh this page.</p>
<button onclick="load()">Refresh traces</button>
<div id="status"></div>
<div id="out"></div>
<script type="module">
  import { getAuthToken } from './api.js';
  async function load() {
    const out = document.getElementById('out');
    const status = document.getElementById('status');
    status.textContent = 'Loading...';
    out.innerHTML = '';
    try {
      const token = getAuthToken();
      const res = await fetch('/api/admin/diag-errors', {
        headers: token ? { 'Authorization': 'Bearer ' + token } : {}
      });
      const data = await res.json();
      if (!res.ok) {
        status.textContent = 'Error: ' + (data.error || res.status);
        return;
      }
      status.textContent = '';
      const traces = data.traces || [];
      if (!traces.length) {
        out.innerHTML = '<p>No traces recorded yet. Run a quote, then refresh.</p>';
        return;
      }
      // Show newest first
      traces.slice().reverse().forEach(t => {
        const div = document.createElement('div');
        div.className = 'trace';
        const stages = (t.stages || []).map(s =>
          `<div class="stage stage-ok">✓ ${s.stage} <span class="meta">+${s.ms}ms</span></div>`
        ).join('');
        const age = Math.round((Date.now() - new Date(t.started).getTime()) / 1000);
        const lastStage = t.stages && t.stages.length ? t.stages[t.stages.length - 1].stage : '(none)';
        const stuck = lastStage !== 'response-sent';
        div.innerHTML =
          `<div><span class="trace-id">${t.id}</span> <span class="meta">${t.started} (${age}s ago)</span></div>` +
          (t.lane ? `<div class="meta">${t.lane}</div>` : '') +
          stages +
          (stuck
            ? `<div class="stage stage-stuck">✗ STUCK after "${lastStage}" — no response sent</div>`
            : `<div class="stage stage-ok">✓ completed</div>`);
        out.appendChild(div);
      });
      if (data.errors && data.errors.length) {
        const ed = document.createElement('div');
        ed.innerHTML = '<h1>Recent errors</h1><pre>' +
          data.errors.map(e => (e.time || '') + ' ' + (e.message || e)).join('\n') + '</pre>';
        out.appendChild(ed);
      }
    } catch (err) {
      status.textContent = 'Failed: ' + err.message;
    }
  }
  window.load = load;
  load();
</script>
</body>
</html>
